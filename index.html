<style>

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 28px calc(env(safe-area-inset-bottom) + 24px);transition:transform .7s var(--ease),opacity .7s}

.top,.meta,.bot{transition:opacity .45s}

#pg.f{animation:fi .5s var(--ease)}#pg.r{animation:ri .55s var(--ease)}

.empty .bt{margin:0 auto;color:#fff}
.row.cur p:before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:#fff;margin-right:10px;vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 </div>

  if(id=='TIT2'||id=='TPE1'||id=='TALB'||id=='TRCK')o[id]=txt(d);
  else if(id=='APIC'&&!o.pic){const e=d[0];let j=1;while(d[j])j++;let q=j+2;
   if(e==1||e==2){while(q+1<d.length&&(d[q]||d[q+1]))q+=2;q+=2}else{while(d[q])q++;q++}

const db=new Promise(r=>{try{const q=indexedDB.open('mono',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});

 const gs=await Promise.all(fs.map(tags));
 fs.forEach((f,k)=>{const g=gs[k],b=f.name.replace(/\.[^.]+$/,'');let ti=g.TIT2,ar=g.TPE1;
  if(!ti){const m=b.split(/\s+-\s+/);if(m.length>1&&!ar){ar=m[0];ti=m.slice(1).join(' - ')}else ti=b}
  T.push({title:ti,artist:ar||'Unknown artist',album:g.TALB||'',no:parseInt(g.TRCK)||0,src:URL.createObjectURL(f),cover:g.pic,fn:f.name+f.size,ck:'w'+T.length});if(store)idb('add',f)});
 if(fs.length)ready()}

/* ---------- library index ---------- */
function rebuild(){const am=new Map,rm=new Map;ac.clear();
 T.forEach((t,n)=>{t.s=nz(t.title+' '+t.artist+' '+t.album);const ar=nz(t.artist);
  if(!rm.has(ar))rm.set(ar,{k:ar,name:t.artist,tracks:[],al:[]});rm.get(ar).tracks.push(n);
  if(t.album){const k=nz(t.album);if(!am.has(k))am.set(k,{k,name:t.album,tracks:[],ars:new Set});const a=am.get(k);a.tracks.push(n);a.ars.add(t.artist)}});
 const byNo=(a,b)=>(T[a].no-T[b].no)||T[a].title.localeCompare(T[b].title,undefined,{numeric:true});
 am.forEach(a=>{a.tracks.sort(byNo);a.artist=a.ars.size==1?[...a.ars][0]:'Various artists';const c=a.tracks.map(n=>T[n].cover).find(Boolean);if(c)a.tracks.forEach(n=>T[n].cover=T[n].cover||c)});
 rm.forEach(r=>{const seen=new Set;r.tracks.forEach(n=>{const k=nz(T[n].album);if(k&&!seen.has(k)){seen.add(k);r.al.push(am.get(k))}});
  r.al.sort((a,b)=>a.name.localeCompare(b.name));r.tracks.sort((a,b)=>T[a].album.localeCompare(T[b].album)||byNo(a,b))});

 SO=T.map((_,n)=>n).sort((a,b)=>T[a].title.localeCompare(T[b].title,undefined,{numeric:true}))}

/* ---------- artwork ---------- */
const ac=new Map();
const art=t=>{if(!ac.has(t.ck))ac.set(t.ck,(async()=>{try{if(t.cover)return t.cover;if(ML&&t.aid!=null){const r=await ML.getArt({path:t.path,albumId:String(t.aid)});if(r&&r.path)return Cap.convertFileSrc(r.path)}}catch(e){}return''})());return ac.get(t.ck)};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const im=e.target;io.unobserve(im);garts(im.dataset.g.split(',').map(Number)).then(u=>{if(u){im.onload=()=>im.classList.add('ld');im.src=u}})}),{root:$('#pg'),rootMargin:'300px'});
const cvh=(ns,name)=>'<div class="cv" data-l="'+E((name.trim()[0]||'').toUpperCase())+'"><img alt="" data-g="'+ns.slice(0,4)+'"></div>';
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%360};
function setCover(u,t,mine){const im=$('#cv'),h=hue((t.album||'')+t.title+t.artist);
 
 $('#fl').textContent=(t.title.trim()[0]||'\u266a').toUpperCase();
 if(!u){im.classList.remove('on');im.dataset.u='';return}
 if(im.dataset.u===u){im.classList.add('on');return}
 im.classList.remove('on');
 const p=new Image();p.onload=()=>{if(mine!==gen)return;setTimeout(()=>{if(mine!==gen)return;im.dataset.u=u;im.src=u;im.classList.add('on')},220)};
 p.onerror=()=>{if(mine===gen)im.dataset.u=''};p.src=u}

/* ---------- views ---------- */
const rows=(ns,num)=>{CL=ns;return ns.map((n,i)=>{const t=T[n];return '<div class="row'+(n==cn()?' cur':'')+'" data-a="song" data-i="'+i+'" data-n="'+n+'">'+(num?'<em>'+pad(t.no||i+1)+'</em>':cvh([n],t.title))+'<div><p>'+E(t.title)+'</p><small>'+E(t.artist+(t.album&&!num?' – '+t.album:''))+'</small></div></div>'}).join('')};
const grid=as=>'<div class="grid">'+as.map(a=>'<div class="al" data-a="album" data-k="'+E(a.k)+'">'+cvh(a.tracks,a.name)+'<p>'+E(a.name)+'</p><small>'+E(a.artist)+'</small></div>').join('')+'</div>';
const arl=rs=>rs.map(r=>'<div class="row ar" data-a="artist" data-k="'+E(r.k)+'">'+cvh(r.tracks,r.name)+'<div><p>'+E(r.name)+'</p><small>'+(r.al.length?r.al.length+(r.al.length==1?' album, ':' albums, '):'')+S(r.tracks)+'</small></div></div>').join('');
const btns='<button class="bt" data-a="play">Play</button><button class="bt" data-a="shuf">Shuffle</button>';
function body(){const q=nz($('#q').value),d=view.d;
 if(!T.length){const b=ML?(perm=='blocked'?'Open settings':'Scan music'):'Add music';return '<div class="empty"><h1>'+(perm?'Allow music access':'No music yet')+'</h1><p style="white-space:normal">'+(ML?'Your phone’s songs will appear here.':'Choose audio files from your device. They stay on this device.')+'</p><button class="bt" data-a="add">'+b+'</button></div>'}
 if(q){const ns=SO.filter(n=>T[n].s.includes(q)),al=[...AM.values()].filter(a=>nz(a.name+' '+a.artist).includes(q)),ar=[...AR.values()].filter(a=>a.k.includes(q));
  if(!ns.length&&!al.length&&!ar.length)return '<div class="empty"><p>Nothing matches “'+E($('#q').value.trim())+'”</p></div>';
  return (ar.length?'<h2>Artists</h2>'+arl(ar.slice(0,5)):'')+(al.length?'<h2>Albums</h2>'+grid(al.slice(0,6)):'')+(ns.length?'<h2>Songs</h2>'+rows(ns.slice(0,60)):'')}
 if(d&&d.t=='album'){const a=AM.get(d.k);if(a){const l=AR.has(nz(a.artist));return '<button class="ib bk" data-a="back" aria-label="Back">'+IC.bk+'</button><div class="dh">'+cvh(a.tracks,a.name)+'<div><h1>'+E(a.name)+'</h1><small'+(l?' data-a="artist" data-k="'+E(nz(a.artist))+'"':'')+'>'+E(a.artist)+'</small><small>'+S(a.tracks)+'</small></div></div>'+btns+'<div style="height:14px"></div>'+rows(a.tracks,1)}}
 if(d&&d.t=='artist'){const r=AR.get(d.k);if(r)return '<button class="ib bk" data-a="back" aria-label="Back">'+IC.bk+'</button><div class="dh ar">'+cvh(r.tracks,r.name)+'<div><h1>'+E(r.name)+'</h1><small>'+S(r.tracks)+'</small></div></div>'+btns+(r.al.length?'<h2>Albums</h2>'+grid(r.al):'')+'<h2>Songs</h2>'+rows(r.tracks)}
 return view.tab=='albums'?grid([...AM.values()]):view.tab=='artists'?arl([...AR.values()]):rows(SO)}
function draw(dir=0,top=true){const pg=$('#pg');pg.innerHTML=body();if(top)pg.scrollTop=0;
 if(dir){pg.classList.remove('f','r');void pg.offsetWidth;pg.classList.add(dir>0?'r':'f')}

 k.style.transform='translateX('+b.offsetLeft+'px) scaleX('+b.offsetWidth+')';$('#tabs').classList.toggle('sq',!!$('#q').value)}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#q').value='';view={tab:b.dataset.t,d:null};nav=[];draw(-1)};
$('#q').oninput=()=>draw(0,true);
const push=d=>{nav.push(view.d);$('#q').value='';view.d=d;draw(1)};
$('#pg').onclick=e=>{const r=e.target.closest('[data-a]');if(!r)return;const a=r.dataset.a;
 if(a=='song')playList(CL,+r.dataset.i);
 else if(a=='album')push({t:'album',k:r.dataset.k});else if(a=='artist')push({t:'artist',k:r.dataset.k});
 else if(a=='back'){view.d=nav.pop()||null;draw(-1)}
 else if(a=='play'&&CL.length)playList(CL,0);
 else if(a=='shuf'&&CL.length){setShuf(1);playList(CL,Math.random()*CL.length|0)}
 else if(a=='add')addBtn()};
const openLib=f=>{document.body.classList.remove('cl');document.body.classList.add('lo');$('#lib').classList.add('open');draw(0,false);if(f)$('#q').focus()};
const closeLib=()=>{document.body.classList.remove('lo');$('#lib').classList.remove('open');$('#q').blur()};
$('#open').onclick=()=>openLib();$('#srch').onclick=()=>openLib(1);$('#close').onclick=closeLib;
function goto(d){view.d=d;nav=[];$('#q').value='';openLib();draw(1)}
$('#sa').onclick=()=>{const t=T[cn()];if(t)goto({t:'artist',k:nz(t.artist)});else addBtn()};
$('#sb').onclick=()=>{const t=T[cn()];if(t&&t.album)goto({t:'album',k:nz(t.album)})};
let y0=0;document.addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientY-y0;if(d<-80&&!e.target.closest('#lib'))openLib();if(d>80&&e.target.closest('#lh'))closeLib()},{passive:true});

/* ---------- playback ---------- */
function initAudio(){if(an)return;try{ctx=new(window.AudioContext||webkitAudioContext)();const s=ctx.createMediaElementSource(au);an=ctx.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.8;s.connect(an);an.connect(ctx.destination);fq=new Uint8Array(an.frequencyBinCount);td=new Uint8Array(an.fftSize).fill(128)}catch(e){an=null}}
const label=(el,t,x)=>{el.textContent=t;el.classList.remove('rise');void el.offsetWidth;el.classList.add('rise')};
async function load(n,play){const t=T[n];if(!t)return;const mine=++gen;au.src=t.src;kick=1;
 document.querySelectorAll('.row[data-n]').forEach(r=>r.classList.toggle('cur',+r.dataset.n==n));
 $('#idx').textContent=pad(qp+1)+' / '+pad(Q.length);
 label($('#title'),t.title);$('#sa').textContent=t.artist;$('#sb').textContent=t.album||'';
 const sub=$('#sub');sub.classList.remove('rise');void sub.offsetWidth;sub.classList.add('rise');
 if(play){initAudio();ctx&&ctx.resume();au.play().catch(()=>{})}
 const u=await Promise.race([art(t),new Promise(r=>setTimeout(()=>r(''),4000))]);if(mine!=gen)return;
 setCover(u,t,mine);
 if('mediaSession'in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:u?[{src:u}]:[]})}catch(e){}}
function playList(l,i){Q=l.slice();qp=i;load(Q[qp],true);closeLib()}
const nx=()=>{if(!Q.length)return;qp=shuf&&Q.length>1?(qp+1+Math.random()*(Q.length-1)|0)%Q.length:(qp+1)%Q.length;load(Q[qp],true)};
const pv=()=>{if(!Q.length)return;if(au.currentTime>3)au.currentTime=0;else{qp=(qp-1+Q.length)%Q.length;load(Q[qp],true)}};
const icon=()=>$('#ico').setAttribute('d',au.paused?'M8 5l11 7-11 7z':'M8 5v14M16 5v14');
au.onplay=au.onpause=icon;au.onended=()=>rep?(au.currentTime=0,au.play()):nx();
$('#play').onclick=async()=>{if(!Q.length)return;initAudio();ctx&&await ctx.resume();au.paused?au.play().catch(()=>{}):au.pause()};
$('#nx').onclick=nx;$('#pv').onclick=pv;
const setShuf=v=>{shuf=v;$('#sh').classList.toggle('on',!!v)};
$('#sh').onclick=()=>setShuf(!shuf);$('#rp').onclick=e=>e.currentTarget.classList.toggle('on',rep=!rep);
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',nx);m.setActionHandler('previoustrack',pv);try{m.setActionHandler('seekto',e=>au.currentTime=e.seekTime)}catch(e){}}
$('#app').onclick=e=>{if(e.target.id==='app'||e.target.id==='stage')document.body.classList.toggle('cl')};

/* ---------- seek line: the timeline itself carries the live waveform ---------- */
const dur=()=>{const d=au.duration;if(isFinite(d)&&d>0)return d;const t=T[cn()];return t&&t.dur||0};
const bc=$('#bar'),g=bc.getContext('2d');let D=1;
new ResizeObserver(()=>{D=Math.min(devicePixelRatio||1,2);bc.width=bc.clientWidth*D;bc.height=bc.clientHeight*D}).observe(bc);
const seek=e=>{const r=bc.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left-10)/(r.width-20))),d=dur();if(d)au.currentTime=p*d};
bc.onpointerdown=e=>{drag=1;bc.setPointerCapture(e.pointerId);seek(e)};bc.onpointermove=e=>drag&&seek(e);bc.onpointerup=bc.onpointercancel=()=>drag=0;
let ph=0,hv=0;
function wave(){const w=bc.width,h=bc.height,m=h/2,d=dur(),L=10*D,f=d?Math.min(1,Math.max(0,au.currentTime/d)):0;
 ph+=(f-ph)*(Math.abs(f-ph)>.2?1:.25);hv+=((drag?1:0)-hv)*.15;
 const px=L+ph*(w-2*L);g.clearRect(0,0,w,h);g.lineCap='round';g.lineWidth=(1+hv*1.5)*D;
 g.strokeStyle='rgba(255,255,255,.2)';g.beginPath();g.moveTo(px,m);g.lineTo(w-L,m);g.stroke();
 g.strokeStyle='#fff';g.beginPath();g.moveTo(L,m);g.lineTo(px,m);g.stroke();
 g.fillStyle='#fff';g.beginPath();g.arc(px,m,(4+hv*3)*D,0,6.2832);g.fill()}

/* ---------- one frame loop; wrapped so a single error can never freeze the clock again ---------- */
const avg=(a,b)=>{let s=0;for(let k=a;k<b;k++)s+=fq[k];return s/(b-a)/255},bgi=$('#cv'),fill=[$('#cur'),$('#dur')];
const tm=()=>{const c=fmt(au.currentTime),d=fmt(dur());if(fill[0].textContent!==c)fill[0].textContent=c;if(fill[1].textContent!==d)fill[1].textContent=d};
['timeupdate','durationchange','loadedmetadata','seeked'].forEach(k=>au.addEventListener(k,tm));
au.addEventListener('play',()=>{ctx&&ctx.state==='suspended'&&ctx.resume().catch(()=>{})});
function frame(){try{let b=0;if(an&&!au.paused){an.getByteFrequencyData(fq);an.getByteTimeDomainData(td);b=Math.pow(avg(0,6),1.6)}
 kick*=.92;b=Math.max(b,kick*.6);sB+=(b-sB)*.25;const s=(1+sB*.035).toFixed(4);bgi.style.transform='scale3d('+s+','+s+',1)';tm();wave()}catch(e){}
 requestAnimationFrame(frame)}
frame();

/* ---------- loading ---------- *//* ---------- loading ---------- */
function ready(){rebuild();if(qp<0&&SO.length){Q=SO.slice();qp=0;load(Q[0],false)}$('#add').textContent=ML?'Rescan':'Add';draw(0,false)}
const idle=(a,b)=>{if(T.length)return;$('#title').textContent=a;$('#sa').textContent=b;$('#sb').textContent=''};
async function scan(){if(!ML)return;
 try{const r=await ML.getTracks();const old=T.length;T=(r.tracks||[]).filter(o=>o&&o.id).map(o=>({...o,aid:o.albumId,ck:'n'+o.albumId,no:+(o.track||o.trackNumber)%1000||0,src:'/_music/'+o.id,dur:(x=>x>36e3?x/1e3:x)(+o.duration||0),title:o.title&&o.title!='<unknown>'?o.title:'Unknown title',artist:o.artist&&o.artist!='<unknown>'?o.artist:'Unknown artist',album:o.album&&o.album!='<unknown>'?o.album:''}));
  perm='';if(T.length){if(old)qp=-1;ready()}else{idle('No music found','Add audio files to your phone, then tap here to rescan');draw()}}
 catch(e){perm=e&&e.error==='permanently_denied'?'blocked':'denied';idle(perm==='blocked'?'Music access blocked':'Allow music access',perm==='blocked'?'Tap here to open app settings':'Tap here to retry');draw()}}
const addBtn=()=>ML?(perm==='blocked'?ML.openSettings():scan()):$('#file').click();
$('#add').onclick=addBtn;$('#title').onclick=()=>{if(!T.length)addBtn()};
$('#file').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};
document.addEventListener('pause',()=>{ctx&&ctx.suspend().catch(()=>{})});
document.addEventListener('resume',()=>{if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{})});
if(ML)scan();else{idle('Add music','Tap here to choose files');draw();idb('get').then(f=>addFiles(f,false))}

</script></body></html>
